name: Build BatteryRemapper

run-name: ${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' && 'Release Build' || 'Test Build') || github.event.pull_request.title }}

on:
  # when manually triggered.
  workflow_dispatch:

  # Pull requests.
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: batteryremapper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Accept Licenses and Install Android SDKs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Make Gradle Wrapper Executable
        if: hashFiles('gradlew') != ''
        run: chmod +x ./gradlew

      - name: Compile Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleRelease \
              -PversionCode=${{ github.run_number }} \
              --stacktrace
          else
            gradle clean assembleRelease \
              -PversionCode=${{ github.run_number }} \
              --stacktrace
          fi

      # Everything below this point runs only for manual builds.
      # Pull requests stop after the unsigned release APK compiles.

      - name: Decode Permanent Keystore
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/---/d' \
            | tr -d '\r\n ' \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

      - name: Zipalign and Sign Release APK
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V \
            | tail -n 1)"

          test -n "$BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/release/BatteryRemapper.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify Signed APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V \
            | tail -n 1)"

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/BatteryRemapper.apk

      - name: Generate APK SHA-256
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd app/build/outputs/apk/release
          sha256sum BatteryRemapper.apk > BatteryRemapper.apk.sha256
          cat BatteryRemapper.apk.sha256

      - name: Upload Release Build
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
        uses: actions/upload-artifact@v6
        with:
          name: BatteryRemapper-Release
          path: |
            app/build/outputs/apk/release/BatteryRemapper.apk
            app/build/outputs/apk/release/BatteryRemapper.apk.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload Test Build
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        uses: actions/upload-artifact@v6
        with:
          name: BatteryRemapper-Test-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/BatteryRemapper.apk
            app/build/outputs/apk/release/BatteryRemapper.apk.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Remove Decoded Keystore
        if: always() && github.event_name == 'workflow_dispatch'
        run: rm -f release.keystore
